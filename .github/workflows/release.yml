name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: frozzie89/home-planner-frontend:${{ github.ref_name }}

  build-pocketbase:
    name: Build & Push PocketBase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./pocketbase
          platforms: linux/amd64,linux/arm64
          push: true
          tags: frozzie89/home-planner-pocketbase:${{ github.ref_name }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-pocketbase]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote :latest tags
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          docker buildx imagetools create \
            --tag frozzie89/home-planner-frontend:latest \
            frozzie89/home-planner-frontend:${{ github.ref_name }}
          docker buildx imagetools create \
            --tag frozzie89/home-planner-pocketbase:latest \
            frozzie89/home-planner-pocketbase:${{ github.ref_name }}

      - name: Generate compose.yml
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          import yaml

          tag = os.environ["IMAGE_TAG"]

          with open("compose.yml") as f:
              compose = yaml.safe_load(f)

          svc = compose["services"]

          svc["frontend"].pop("build", None)
          svc["frontend"]["image"] = f"frozzie89/home-planner-frontend:{tag}"

          svc["pocketbase"].pop("build", None)
          svc["pocketbase"]["image"] = f"frozzie89/home-planner-pocketbase:{tag}"

          with open("compose.yml", "w") as f:
              yaml.dump(compose, f, default_flow_style=False, sort_keys=False)

          print(f"Generated compose.yml with tag {tag}")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            compose.yml
            .env.example
